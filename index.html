<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0d0d0d"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Lift Tracker"
    >


    <title>Lift Tracker</title>


    <!-- PWA Manifest -->
    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- iPhone Home Screen Icon -->
    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >


    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="app">

        <header>

            <p class="app-label">
                LIFT TRACKER
            </p>

            <h1 id="workout-title">
                Loading...
            </h1>

            <p id="current-date"></p>

        </header>


        <section id="workout-container">

            <!-- JavaScript creates workout here -->

        </section>

    </main>


    <script src="app.js"></script>


    <!-- Register Service Worker -->
    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker.register(
                        "./service-worker.js"
                    );

                }
            );

        }

    </script>

</body>

</html>
