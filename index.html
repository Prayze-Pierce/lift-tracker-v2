<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            viewport-fit=cover
        "
    >


    <title>Lift Tracker</title>


    <!-- =========================
         APP COLORS
    ========================== -->

    <meta
        name="theme-color"
        content="#0d0d0d"
    >


    <!-- =========================
         IPHONE / IOS
    ========================== -->

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Lift Tracker"
    >


    <!-- =========================
         PWA
    ========================== -->

    <link
        rel="manifest"
        href="./manifest.json"
    >


    <link
        rel="apple-touch-icon"
        href="./icons/icon-192.png"
    >


    <!-- =========================
         STYLES
    ========================== -->

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <main class="app">

        <header class="header">

            <div class="header-top">

                <p class="logo">
                    LIFT TRACKER
                </p>


                <button
                    id="menu-button"
                    class="menu-button hidden"
                    type="button"
                    aria-label="Open menu"
                >
                    ☰
                </button>

            </div>


            <h1 id="page-title">
                Loading...
            </h1>


            <p id="page-subtitle"></p>

        </header>


        <section id="app-container">
        </section>

    </main>


    <!-- =========================
         APP
    ========================== -->

    <script src="./app.js"></script>


    <!-- =========================
         SERVICE WORKER
    ========================== -->

    <script>

        if (
            "serviceWorker" in
            navigator
        ) {

            window.addEventListener(
                "load",
                () => {

                    navigator
                        .serviceWorker
                        .register(
                            "./service-worker.js"
                        )
                        .then(
                            registration => {

                                console.log(
                                    "Lift Tracker service worker registered.",
                                    registration
                                );
                            }
                        )
                        .catch(
                            error => {

                                console.error(
                                    "Service worker registration failed:",
                                    error
                                );
                            }
                        );
                }
            );
        }

    </script>

</body>

</html>
